name: Deploy to Cloudflare

# Single frontend target: https://onebrains.pages.dev
#
# OpenNext is published as Worker `onebrain` (ASSETS + PLATFORM_API). Pages
# Direct Upload only aliases onebrains.pages.dev onto that Worker. Uploading
# OpenNext as Pages `_worker.js` drops ASSETS and serves unstyled HTML.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Source: https://github.com/hiraypawan/OneBrain.git
# Single domain: https://onebrains.pages.dev

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY }}
  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a4e4e2bec6f7d6bf6a4dc03d732bbdc9' }}
  PUBLIC_URL: https://onebrains.pages.dev

jobs:
  credentials:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    steps:
      - name: Require API token
        run: |-
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && { [ -z "$CLOUDFLARE_API_KEY" ] || [ -z "$CLOUDFLARE_EMAIL" ]; }; then
            echo "::error::Missing Cloudflare credentials. Add repo secret CLOUDFLARE_API_TOKEN (Cloudflare Dashboard → My Profile → API Tokens → Edit Cloudflare Workers, and include Account.Cloudflare Pages.Edit). Optional: CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          echo "Cloudflare credentials are present. Account ${CLOUDFLARE_ACCOUNT_ID:0:8}…"

  api:
    name: Deploy API worker
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/api/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: workers/api
      - name: Publish onebrain-api
        run: npx wrangler deploy
        working-directory: workers/api

  frontend:
    name: Deploy onebrains.pages.dev
    # OpenNext Worker first (CSS via ASSETS + PLATFORM_API), then Pages alias.
    needs: [credentials, api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build OpenNext
        run: npx opennextjs-cloudflare build
        working-directory: frontend

      - name: Publish OpenNext Worker
        run: npx wrangler deploy
        working-directory: frontend

      # Pages cannot host the OpenNext Worker (no ASSETS binding → unstyled HTML).
      # Dist is only the alias _worker.js that forwards to service onebrain.
      - name: Assemble Pages alias
        working-directory: frontend
        run: |
          set -euo pipefail
          bundle="pages-deploy/dist"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          cp pages-deploy/_worker.js "$bundle/_worker.js"

      - name: Publish onebrains.pages.dev
        working-directory: frontend/pages-deploy
        run: |
          set -euo pipefail
          npx wrangler pages deploy --branch main --commit-dirty=true

      - name: Verify onebrains.pages.dev is live
        run: |
          set -uo pipefail
          url="$PUBLIC_URL/api/platform/capabilities"
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/capabilities.json -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "attempt ${attempt}/12 → HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "PLATFORM_API is reachable through the Pages alias."
              head -c 200 /tmp/capabilities.json; echo
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::${url} did not return 200 (last: ${code}). Check APP binding to Worker onebrain and Pages production branch main."
              exit 1
            fi
            sleep 10
          done
          html=""
          for attempt in $(seq 1 8); do
            html=$(curl -sS --max-time 20 "$PUBLIC_URL/" || true)
            css=$(printf '%s' "$html" | grep -oE '/_next/static/[^"[:space:]]+\.css' | head -1 || true)
            if [ -n "$css" ]; then
              ccode=$(curl -sS -o /tmp/app.css -w '%{http_code}' --max-time 20 "$PUBLIC_URL$css" || echo 000)
              echo "stylesheet ${css} → HTTP ${ccode}"
              if [ "$ccode" = "200" ] && grep -qE 'ob-bg|--amber|bg-black' /tmp/app.css; then
                echo "CSS is reachable; pages.dev should match the Worker UI."
                exit 0
              fi
            fi
            sleep 8
          done
          echo "::error::$PUBLIC_URL did not serve OpenNext CSS. HTML would render unstyled (purple links, numbered 1. 1Write)."
          exit 1

      - name: Report deployed commit
        if: always()
        working-directory: frontend/pages-deploy
        run: |
          npx wrangler pages deployment list --project-name onebrains > /tmp/deployments.txt 2>&1 || true
          echo "### onebrains.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -20 /tmp/deployments.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "deployment list unavailable" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            echo "- Expected commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${PUBLIC_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
