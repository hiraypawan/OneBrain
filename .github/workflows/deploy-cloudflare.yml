name: Cloudflare artifact check (no deployment)
# The former push-to-main static export cannot serve Google OAuth or the API proxy.
# This manual workflow builds artifacts only. Production deployment needs a separate reviewed release.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: frontend
      - run: npx opennextjs-cloudflare build
        working-directory: frontend
      - run: npm ci
        working-directory: workers/api
      - run: npx wrangler deploy --dry-run
        working-directory: workers/api
