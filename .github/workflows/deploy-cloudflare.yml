name: Deploy API worker
# Auto-deploys workers/api to Cloudflare on every push to main.
# One-time setup: GitHub repo → Settings → Secrets → Actions → add
#   CLOUDFLARE_API_TOKEN (create at dash.cloudflare.com/profile/api-tokens
#   using the "Edit Cloudflare Workers" template).

on:
  push:
    branches: [main]
    paths: ['workers/api/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: workers/api
      - run: npx wrangler deploy
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4e4e2bec6f7d6bf6a4dc03d732bbdc9
