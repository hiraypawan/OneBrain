name: Deploy to Cloudflare

# Single frontend target: https://onebrains.pages.dev
#
# Cloudflare Dashboard Git integration cannot build this OpenNext + API monorepo
# (the app lives in frontend/, the API in workers/api/), so GitHub Actions
# publishes both Workers and the Pages project (Direct Upload) with
# CLOUDFLARE_API_TOKEN. No other domain is published by this workflow.
#
# The Pages step reads frontend/pages-deploy/wrangler.jsonc, which declares the
# PLATFORM_API service binding. Without that binding the site serves the shell
# but every /api/platform/* request returns 503.
on:
  push:
    branches: [main, arena/01a09530-onebrain]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY }}
  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a4e4e2bec6f7d6bf6a4dc03d732bbdc9' }}
  PUBLIC_URL: https://onebrains.pages.dev

jobs:
  credentials:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    steps:
      - name: Require API token
        run: |-
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && { [ -z "$CLOUDFLARE_API_KEY" ] || [ -z "$CLOUDFLARE_EMAIL" ]; }; then
            echo "::error::Missing Cloudflare credentials. Add repo secret CLOUDFLARE_API_TOKEN (Cloudflare Dashboard → My Profile → API Tokens → Edit Cloudflare Workers, and include Account.Cloudflare Pages.Edit). Optional: CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          echo "Cloudflare credentials are present. Account ${CLOUDFLARE_ACCOUNT_ID:0:8}…"

  api:
    name: Deploy API worker
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/api/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: workers/api
      - name: Publish onebrain-api
        run: npx wrangler deploy
        working-directory: workers/api

  frontend:
    name: Deploy onebrains.pages.dev
    # The Pages build resolves its PLATFORM_API service binding to onebrain-api,
    # so the API must exist (and be current) before the frontend is published.
    needs: [credentials, api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build OpenNext
        run: npx opennextjs-cloudflare build
        working-directory: frontend

      # The bundle lands next to its Pages config so `wrangler pages deploy`
      # resolves wrangler.jsonc from the working directory (Pages rejects
      # --config).
      - name: Assemble Pages bundle
        working-directory: frontend
        run: |
          set -euo pipefail
          bundle="pages-deploy/dist"
          rm -rf "$bundle"
          mkdir -p "$bundle"

          if [ ! -d .open-next/assets ]; then
            echo "::error::OpenNext produced no .open-next/assets directory."
            exit 1
          fi
          cp -a .open-next/assets/. "$bundle"/

          # Static files alone are not enough. OpenNext's worker.js is a thin ESM
          # wrapper that imports sibling modules (./cloudflare/*, ./middleware/*,
          # ./.build/durable-objects/*, ./server-functions/*). Pages bundles
          # _worker.js with esbuild at deploy time, so every imported path must
          # be uploaded alongside it or the bundle fails with
          # "Could not resolve". Copy every sibling except assets, which is
          # already at the root. dotglob is needed for ./.build.
          shopt -s dotglob nullglob
          for entry in .open-next/*; do
            name="$(basename "$entry")"
            case "$name" in
              assets|worker.js) continue ;;
            esac
            cp -a "$entry" "$bundle/"
          done
          shopt -u dotglob nullglob

          if [ ! -f .open-next/worker.js ]; then
            echo "::error::No OpenNext Worker bundle found; Pages would deploy without server routes."
            exit 1
          fi
          cp .open-next/worker.js "$bundle/_worker.js"

          # Fail here with a clear message rather than letting the Pages build
          # stage report an opaque esbuild "Could not resolve".
          missing=""
          while IFS= read -r spec; do
            [ -e "$bundle/${spec#./}" ] || missing="$missing $spec"
          done < <(grep -oE 'from "\./[^"]+"' "$bundle/_worker.js" | sed -E 's/^from "\.\///; s/"$//')
          if [ -n "$missing" ]; then
            echo "::error::_worker.js imports files missing from the bundle:$missing"
            exit 1
          fi

          echo "Bundle assembled ($(du -sh "$bundle" | cut -f1), $(find "$bundle" -type f | wc -l) files)."

      # Runs from the directory holding the Pages config, so wrangler.jsonc is
      # the default-path config Pages requires. Neither --config nor a
      # positional directory is passed: the config supplies the project name,
      # the output directory and the PLATFORM_API binding. Omitting
      # --project-name is deliberate — if the config were ignored the deploy
      # fails instead of silently publishing a binding-less bundle.
      - name: Publish onebrains.pages.dev
        working-directory: frontend/pages-deploy
        run: |
          set -euo pipefail
          npx wrangler pages deploy --branch main --commit-dirty=true

      # A green publish is not proof the domain was updated: uploads to a
      # non-production branch never reach the onebrains.pages.dev alias, and a
      # missing service binding fails only at request time.
      - name: Verify onebrains.pages.dev is live
        run: |
          set -uo pipefail
          url="$PUBLIC_URL/api/platform/capabilities"
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/capabilities.json -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "attempt ${attempt}/12 → HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "PLATFORM_API service binding is reachable from the Pages deployment."
              head -c 200 /tmp/capabilities.json; echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::${url} did not return 200 (last: ${code}). The deployment may have landed on a preview branch, or frontend/pages-deploy/wrangler.jsonc is not supplying the PLATFORM_API binding. Check Cloudflare → Workers & Pages → onebrains → Settings → Production branch."
          exit 1

      - name: Report deployed commit
        if: always()
        working-directory: frontend/pages-deploy
        run: |
          npx wrangler pages deployment list --project-name onebrains > /tmp/deployments.txt 2>&1 || true
          echo "### onebrains.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -20 /tmp/deployments.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "deployment list unavailable" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            echo "- Expected commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${PUBLIC_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
